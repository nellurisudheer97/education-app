spring:
  application:
    name: educational-platform

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

  datasource:
    url: ${{ Postgres.DATABASE_URL }}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            protocols: TLSv1.2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_change_this_in_production_12345678901234567890}
  expiration: ${JWT_EXPIRATION_MS:86400000}

file:
  upload-dir: ${UPLOAD_DIR:./uploads}
  video-dir: ${VIDEO_UPLOAD_DIR:./uploads/videos}
  course-dir: ${COURSE_UPLOAD_DIR:./uploads/courses}
  book-dir: ${BOOK_UPLOAD_DIR:./uploads/books}
